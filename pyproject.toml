[project]
name = "nlp-serving"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saugata Roy Arghya", email = "saugataroyarghya@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bentoml>=1.4.39",
    "gliner==0.2.29",
    "gliner2[local]>=2.0.0",
    "keybert==0.9.0",
    "laya==0.3.4",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "transformers>=4.38,<5",
]

[project.scripts]
nlp-serving = "nlp_serving:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
